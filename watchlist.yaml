# Movies to watch. Add one entry per movie you care about.
#
# Fields:
#   name:                 canonical name (used in alerts)
#   aliases:              alternate spellings / short forms
#   hashtags:             hashtags (without the #) for Twitter matching
#   priority:             "high" fires full reminder cascade (T-24h/-1h/-5min/0/+2min);
#                         "normal" fires T-1h/-5min/0 only
#   google_news_queries:  optional list of Google News queries. If omitted,
#                         a reasonable default is auto-generated from the name.
#                         Add specific queries if the default is too noisy
#                         (e.g. filter by city or a specific screen name).
#
# Delete entries once the booking is done.

movies:
  - name: "Avengers: Doomsday"
    aliases:
      - "Avengers Doomsday"
      - "Doomsday"
      - "Avengers 5"
    hashtags:
      - "AvengersDoomsday"
      - "Doomsday"
    priority: high
    google_news_queries:
      # General India-wide booking news. PCX openings are usually folded into
      # these articles (specific screen-level coverage doesn't exist on
      # Google News).
      - '"Avengers Doomsday" ("advance booking" OR "bookings open" OR "tickets go live")'
      # Hyderabad-specific — catches multiplex-city coverage (TOI Hyderabad,
      # Siasat, Telangana Today) that sometimes name-checks Prasads.
      - '"Avengers Doomsday" Hyderabad ("advance booking" OR "bookings open" OR "Prasads")'
    # Instagram accounts to poll (only if XPOZ_API_KEY set). Polled every 30 min
    # to conserve xpoz credits. Prasads posts about every major release
    # (verified: Ramayana, DNK, Suriya's Scene, Thaman — all in last week),
    # so they will almost certainly post when PCX opens Doomsday bookings.
    instagram_handles:
      - prasadsmultiplx

  # Example (uncomment when relevant):
  # - name: "Avatar: Fire and Ash"
  #   aliases: ["Avatar 3", "Fire and Ash"]
  #   hashtags: ["AvatarFireAndAsh", "Avatar3"]
  #   priority: high
